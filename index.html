<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🍄 Timer Primordi Porcini — Pratomagno</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#eef4ed;margin:0;padding:20px;color:#243024}
.container{max-width:1180px;margin:auto;background:rgba(255,255,255,.97);padding:24px;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
h1{text-align:center;color:#1b5e20;margin-bottom:6px}
.subtitle{text-align:center;color:#667;font-size:16px;margin-top:0}
select,button{width:100%;padding:12px;margin:6px 0 12px;border-radius:9px;border:1px solid #cfd7cf;font-size:16px;box-sizing:border-box}
button{background:#1b5e20;color:#fff;border:none;font-weight:bold;cursor:pointer}
button:hover{background:#2e7d32}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.card{background:#fff;border-radius:12px;padding:15px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.label{color:#667;font-size:13px}.value{font-size:21px;font-weight:bold;margin-top:5px}
.box{margin-top:16px;padding:18px;border-radius:13px;background:#f7faf7;border-left:7px solid #1b5e20}
.box.gold{background:#fffbea;border-left-color:#c79a00}.box.dead{background:#fff1f1;border-left-color:#c62828}
.box.blue{background:#f2f8ff;border-left-color:#1976d2}
.big{font-size:34px;font-weight:bold}.good{color:#2e7d32}.warn{color:#ef6c00}.bad{color:#c62828}
.small{font-size:13px;color:#667;line-height:1.45}
.forecast{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
.day{background:#fff;border-radius:10px;padding:10px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.07)}
.day.best{outline:3px solid #2e7d32;background:#f1faef}
.day .date{font-weight:bold;color:#1b5e20}.day .rain{color:#1565c0}.day .temp{color:#d84315}
.loading{text-align:center;padding:25px;font-size:18px}
.legend{font-size:13px;color:#667}
hr{border:0;border-top:1px solid #ddd;margin:22px 0}
canvas{margin-top:20px}
.status{font-size:18px;font-weight:bold}
.killer{padding:8px 10px;margin:5px 0;border-radius:8px;background:#fff0f0}
.ok{padding:8px 10px;border-radius:8px;background:#eff9ef}
</style>
</head>
<body>
<div class="container">
<h1>🍄 Timer Primordi Porcini</h1>
<p class="subtitle">Quota • Termica • Terreno • Micelio • Finestra Primordi</p>

<label><b>📍 Località</b></label>
<select id="localita">
<option value="43.648210837035236,11.672634310976488">Pozza Nera</option>
<option value="43.61493048759856,11.69405168018871">Monte Lori Pic Nic</option>
<option value="43.60871375792392,11.705157764789897">Monte Lori Campeggio</option>
<option value="43.620597527331924,11.657856370237369">Tre Fonti</option>
<option value="43.619602322842674,11.65123576223233">Trappola</option>
<option value="43.61273877340515,11.656966725681125">Trevane</option>
<option value="43.50398069862869,11.545716077300723">Cocioni</option>
<option value="43.48898753383693,11.512202978459452">Moncioni</option>
<option value="43.52542199979008,11.522390226279295">Cavriglia Quercie</option>
<option value="43.52070302717631,11.502276149076717">Cavriglia Alta</option>
<option value="43.46761467459521,11.670888620816104">Pergine Valdarno</option>
<option value="43.53632378809326,11.625183736328342">Tasso Lore</option>
</select>

<div class="grid">
<div>
<label><b>🌳 Tipo bosco</b></label>
<select id="bosco">
<option value="auto">Non specificato</option>
<option value="castagno">Castagneto / Querceto</option>
<option value="faggio">Faggeta</option>
<option value="abete">Abetaia</option>
</select>
</div>
<div>
<label><b>🧭 Esposizione</b></label>
<select id="esposizione">
<option value="auto">Non specificata</option>
<option value="n">Nord</option>
<option value="ne">Nord-Est</option>
<option value="e">Est</option>
<option value="se">Sud-Est</option>
<option value="s">Sud</option>
<option value="so">Sud-Ovest</option>
<option value="o">Ovest</option>
<option value="no">Nord-Ovest</option>
</select>
</div>
<div>
<label><b>🍄 Tipologia</b></label>
<select id="specie">
<option value="edulis">Edulis / Rosso — 12–18 °C</option>
<option value="aestivalis">Aestivalis — 18–24 °C</option>
</select>
</div>
</div>

<button onclick="analizza()">🔍 Analizza Località</button>
<div id="risultato" class="card">Seleziona una località e premi “Analizza Località”.</div>
<canvas id="grafico"></canvas>
</div>

<script>
let grafico = null;

const MONTEVARCHI_QUOTA = 100;
const GRADIENTE_TERMICO = 0.6; // °C ogni 100 m
const STORICO_GIORNI = 14;
const PREVISIONE_GIORNI = 7;

// Finestra generica indicata nel progetto: primordi 14–20 giorni.
// Finestra specifica per bosco: castagno/quercia 8–12; faggio/abete 15–22.
const FINESTRA_GENERIC_MIN = 14;
const FINESTRA_GENERIC_MAX = 20;

function clamp(n,min,max){return Math.max(min,Math.min(max,n));}
function avg(arr){const v=arr.filter(x=>Number.isFinite(x));return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
function fmt(n,d=1){return Number.isFinite(n)?n.toFixed(d):"N/D";}
function formatData(s){return new Date(s+"T12:00:00").toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit"});}
function nomeGiorno(s){return new Date(s+"T12:00:00").toLocaleDateString("it-IT",{weekday:"short"});}
function normalizeAngle(a){return ((a%360)+360)%360;}
function isNorthWind(deg){
    if(!Number.isFinite(deg)) return false;
    const d=normalizeAngle(deg);
    return d>=315 || d<=45;
}
function classe(n){return n>=75?"good":n>=50?"warn":"bad";}

/*
  Correzione termica richiesta:
  Sud / SE / SO = circa 150–200 m "più basso" termicamente.
  Usiamo 175 m come valore centrale, ma lo mostriamo come stima.
  Non viene applicata se l'esposizione non è specificata.
*/
function correzioneEsposizione(exp){
    if(["s","se","so"].includes(exp)) return 175;
    return 0;
}

/* Bosco: correzione indicata dall'utente per faggeta/abetaia:
   ombra profonda ≈ -1 °C sul terreno.
   Non inventiamo una correzione numerica per castagneto/querceto:
   li marchiamo semplicemente come più aperti/luminosi. */
function correzioneBoscoTerreno(bosco){
    if(["faggio","abete"].includes(bosco)) return -1;
    return 0;
}

function finestraBosco(bosco){
    if(["castagno"].includes(bosco)) return [8,12];
    if(["faggio","abete"].includes(bosco)) return [15,22];
    return [FINESTRA_GENERIC_MIN,FINESTRA_GENERIC_MAX];
}

/* Calcolo della quota termica equivalente.
   Se T_piano è la temperatura di riferimento e T_target è la temperatura
   desiderata, il dislivello è (T_piano - T_target)/0.6*100.
   La quota SLM è poi Montevarchi (100 m) + dislivello.
*/
function quotaDaTemperatura(tempPiano,tempTarget){
    if(!Number.isFinite(tempPiano)||!Number.isFinite(tempTarget)) return null;
    const dislivello=(tempPiano-tempTarget)/GRADIENTE_TERMICO*100;
    return MONTEVARCHI_QUOTA+dislivello;
}

async function recuperaAltitudine(lat,lon){
    const url=`https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lon}`;
    const r=await fetch(url);
    if(!r.ok) throw new Error("Errore recupero altitudine");
    const d=await r.json();
    return Array.isArray(d.elevation)?d.elevation[0]:null;
}

/* Media giornaliera di una serie oraria, raggruppata per data. */
function medieGiornaliere(times,values){
    const map={};
    for(let i=0;i<times.length;i++){
        const day=times[i].slice(0,10);
        const v=values[i];
        if(Number.isFinite(v)){
            if(!map[day]) map[day]=[];
            map[day].push(v);
        }
    }
    const out={};
    Object.keys(map).forEach(day=>out[day]=avg(map[day]));
    return out;
}

function sommaGiornaliera(times,values){
    const map={};
    for(let i=0;i<times.length;i++){
        const day=times[i].slice(0,10);
        const v=Number.isFinite(values[i])?values[i]:0;
        map[day]=(map[day]||0)+v;
    }
    return map;
}

function trovaUltimoCiclo(dates, rain, tmin, tmax, windDir){
    // Regola iniziale: un "evento pioggia" è una giornata con >= 5 mm.
    // La soglia è volutamente in una costante modificabile.
    const SOGLIA_PIOGGIA_EVENTO=5;
    let ultimoEvento=null;
    let killerDopoEvento=[];
    let killerAttivo=false;

    for(let i=0;i<dates.length;i++){
        const killerGelo=Number.isFinite(tmin[i]) && tmin[i]<=0;
        const killerCaldo=Number.isFinite(tmax[i]) && tmax[i]>30;
        const killerTramontana=isNorthWind(windDir[i]);
        const killer=killerGelo||killerCaldo||killerTramontana;

        if(killer){
            if(ultimoEvento!==null){
                killerDopoEvento.push({
                    data:dates[i],
                    gelo:killerGelo,
                    caldo:killerCaldo,
                    tramontana:killerTramontana
                });
            }
            killerAttivo=true;
        }

        if(rain[i]>=SOGLIA_PIOGGIA_EVENTO){
            ultimoEvento=dates[i];
            killerDopoEvento=[];
            killerAttivo=false;
        }
    }

    return {ultimoEvento,killerDopoEvento,killerAttivo,SOGLIA_PIOGGIA_EVENTO};
}

async function analizza(){
    const select=document.getElementById("localita");
    const [lat,lon]=select.value.split(",").map(Number);
    const nome=select.options[select.selectedIndex].text;
    const bosco=document.getElementById("bosco").value;
    const esposizione=document.getElementById("esposizione").value;
    const specie=document.getElementById("specie").value;

    document.getElementById("risultato").innerHTML='<div class="loading">⏳ Recupero quota, meteo, terreno e storico degli ultimi 14 giorni...</div>';

    try{
        const altitudine=await recuperaAltitudine(lat,lon);

        /*
          Open-Meteo Forecast API:
          14 giorni passati + 7 giorni futuri.
          Usiamo dati giornalieri per aria/pioggia e orari per terreno.
        */
        const url=`https://api.open-meteo.com/v1/forecast?`+
          `latitude=${lat}&longitude=${lon}`+
          `&past_days=${STORICO_GIORNI}`+
          `&forecast_days=${PREVISIONE_GIORNI}`+
          `&daily=temperature_2m_max,temperature_2m_min,temperature_2m_mean,precipitation_sum,relative_humidity_2m_mean,wind_direction_10m_dominant`+
          `&hourly=soil_temperature_0_to_7cm,soil_temperature_7_to_28cm,soil_moisture_0_to_7cm,soil_moisture_7_to_28cm`+
          `&timezone=auto`;

        const r=await fetch(url);
        if(!r.ok) throw new Error("Errore recupero dati Open-Meteo");
        const data=await r.json();

        const days=data.daily.time;
        const nHist=STORICO_GIORNI;
        const histDays=days.slice(0,nHist);
        const futureDays=days.slice(nHist);

        const tmax=data.daily.temperature_2m_max;
        const tmin=data.daily.temperature_2m_min;
        const tmean=data.daily.temperature_2m_mean;
        const rain=data.daily.precipitation_sum;
        const rh=data.daily.relative_humidity_2m_mean;
        const wind=data.daily.wind_direction_10m_dominant;

        const soil0Map=medieGiornaliere(data.hourly.time,data.hourly.soil_temperature_0_to_7cm);
        const soil1Map=medieGiornaliere(data.hourly.time,data.hourly.soil_temperature_7_to_28cm);
        const moist0Map=medieGiornaliere(data.hourly.time,data.hourly.soil_moisture_0_to_7cm);
        const moist1Map=medieGiornaliere(data.hourly.time,data.hourly.soil_moisture_7_to_28cm);

        const soil0Hist=histDays.map(d=>soil0Map[d]);
        const soil1Hist=histDays.map(d=>soil1Map[d]);
        const moist0Hist=histDays.map(d=>moist0Map[d]);
        const moist1Hist=histDays.map(d=>moist1Map[d]);

        const temp4=avg(tmean.slice(nHist-4,nHist));
        const temp7=avg(tmean.slice(nHist-7,nHist));
        const max4=avg(tmax.slice(nHist-4,nHist));
        const min4=avg(tmin.slice(nHist-4,nHist));
        const max7=avg(tmax.slice(nHist-7,nHist));
        const min7=avg(tmin.slice(nHist-7,nHist));

        const soil0=avg(soil0Hist.slice(-3));
        const soil1=avg(soil1Hist.slice(-3));
        const moist0=avg(moist0Hist.slice(-3));
        const moist1=avg(moist1Hist.slice(-3));

        const rain3=rain.slice(nHist-3,nHist).reduce((a,b)=>a+(b||0),0);
        const rain7=rain.slice(nHist-7,nHist).reduce((a,b)=>a+(b||0),0);
        const rain14=rain.slice(0,nHist).reduce((a,b)=>a+(b||0),0);

        const ciclo=trovaUltimoCiclo(histDays,rain.slice(0,nHist),tmin.slice(0,nHist),tmax.slice(0,nHist),wind.slice(0,nHist));

        let giorniDalEvento=null;
        if(ciclo.ultimoEvento){
            const d0=new Date(ciclo.ultimoEvento+"T12:00:00");
            const oggi=new Date(histDays[nHist-1]+"T12:00:00");
            giorniDalEvento=Math.floor((oggi-d0)/86400000);
        }

        const [termMin,termMax]=specie==="edulis"?[12,18]:[18,24];
        const tempTermica=Number.isFinite(temp7)?temp7:null;
        const quotaTermicaBassa=Number.isFinite(tempTermica)?quotaDaTemperatura(tempTermica,termMax):null;
        const quotaTermicaAlta=Number.isFinite(tempTermica)?quotaDaTemperatura(tempTermica,termMin):null;

        // Interpretazione quota: fascia tra le quote corrispondenti alla finestra termica.
        let q1=quotaTermicaBassa, q2=quotaTermicaAlta;
        if(Number.isFinite(q1)&&Number.isFinite(q2)&&q1>q2){const x=q1;q1=q2;q2=x;}

        const corrExp=correzioneEsposizione(esposizione);
        const corrBosco=correzioneBoscoTerreno(bosco);
        const soil0Corretto=Number.isFinite(soil0)?soil0+corrBosco:null;
        const soil1Corretto=Number.isFinite(soil1)?soil1+corrBosco:null;

        let zonaTerreno="DATO NON DISPONIBILE";
        let zonaClass="";
        const s=Math.max(soil0Corretto??-999,soil1Corretto??-999);
        if(Number.isFinite(soil0Corretto)&&Number.isFinite(soil1Corretto)){
            if(soil0Corretto>=12&&soil0Corretto<=24&&soil1Corretto>=12&&soil1Corretto<=24){
                zonaTerreno="🟢 ZONA ORO — 12–24 °C";
                zonaClass="gold";
            }else if((soil0Corretto>=27&&soil0Corretto<=28)||(soil1Corretto>=27&&soil1Corretto<=28)){
                zonaTerreno="🔴 ZONA MORTA — 27–28 °C";
                zonaClass="dead";
            }else{
                zonaTerreno="🟡 FUORI ZONA ORO";
                zonaClass="gold";
            }
        }

        let finestraBoscoArr=finestraBosco(bosco);
        let timerTesto="Nessun Giorno 0 identificato negli ultimi 14 giorni.";
        let timerClasse="bad";
        if(giorniDalEvento!==null){
            const g=giorniDalEvento;
            if(g<5){timerTesto=`Giorno ${g} — acqua in fase di penetrazione nel terreno`;}
            else if(g<8){timerTesto=`Giorno ${g} — fase di attivazione del ciclo`;}
            else if(g<=12 && ["castagno"].includes(bosco)){timerTesto=`Giorno ${g} — dentro la finestra indicativa Castagno/Quercia` ; timerClasse="good";}
            else if(g>=15 && g<=22 && ["faggio","abete"].includes(bosco)){timerTesto=`Giorno ${g} — dentro la finestra indicativa Faggio/Abete` ; timerClasse="good";}
            else if(g>=FINESTRA_GENERIC_MIN&&g<=FINESTRA_GENERIC_MAX){timerTesto=`Giorno ${g} — dentro la finestra generica 14–20 giorni`;timerClasse="good";}
            else if(g>FINESTRA_GENERIC_MAX){timerTesto=`Giorno ${g} — oltre la finestra generica 14–20 giorni`;timerClasse="warn";}
            else {timerTesto=`Giorno ${g} — ciclo in sviluppo`;}
        }

        let killerHtml="";
        if(ciclo.killerDopoEvento.length){
            ciclo.killerDopoEvento.forEach(k=>{
                const cause=[];
                if(k.tramontana) cause.push("Tramontana");
                if(k.gelo) cause.push("notte ≤ 0 °C");
                if(k.caldo) cause.push("caldo > 30 °C");
                killerHtml+=`<div class="killer">⚠️ ${formatData(k.data)} — ${cause.join(" + ")}</div>`;
            });
        }else{
            killerHtml='<div class="ok">✅ Nessun Killer rilevato dopo l’ultimo evento pioggia nel periodo analizzato.</div>';
        }

        // Punteggio tecnico, NON una probabilità biologica.
        // Serve solo a riassumere la coerenza delle condizioni osservate.
        let indice=0;
        if(soil0Corretto>=12&&soil0Corretto<=24) indice+=20;
        if(soil1Corretto>=12&&soil1Corretto<=24) indice+=20;
        if(rain7>=10) indice+=15;
        if(rain14>=20) indice+=10;
        if(temp7>=termMin&&temp7<=termMax) indice+=20;
        if(giorniDalEvento!==null&&giorniDalEvento>=8&&giorniDalEvento<=20) indice+=15;
        if(ciclo.killerDopoEvento.length===0) indice+=10;
        if(Number.isFinite(altitudine)&&Number.isFinite(q1)&&Number.isFinite(q2)){
            const qCorr=altitudine-corrExp;
            if(qCorr>=q1&&qCorr<=q2) indice+=10;
        }
        indice=clamp(Math.round(indice),0,100);

        // Previsione giornaliera semplice: temperatura + pioggia.
        const futTmax=tmax.slice(nHist);
        const futTmin=tmin.slice(nHist);
        const futRain=rain.slice(nHist);
        const futRh=rh.slice(nHist);
        const scores=futureDays.map((d,i)=>{
            const tm=(futTmax[i]+futTmin[i])/2;
            let sc=0;
            if(tm>=termMin&&tm<=termMax) sc+=45;
            else if(tm>=termMin-2&&tm<=termMax+2) sc+=25;
            if(futRain[i]>=2) sc+=25;
            if(futRain[i]>=5) sc+=10;
            if((futRh[i]||0)>=75) sc+=15;
            return clamp(sc,0,100);
        });
        const best=Math.max(...scores);
        const bestIdx=scores.indexOf(best);

        const html=`
        <h2 class="${classe(indice)}">${indice>=75?"🟢":indice>=50?"🟡":"🔴"} Coerenza condizioni: ${indice}/100</h2>
        <h3>📍 ${nome}</h3>
        <div class="grid">
          <div class="card"><div class="label">Quota GPS</div><div class="value">${Number.isFinite(altitudine)?Math.round(altitudine)+" m":"N/D"}</div></div>
          <div class="card"><div class="label">Latitudine</div><div class="value">${lat.toFixed(5)}</div></div>
          <div class="card"><div class="label">Longitudine</div><div class="value">${lon.toFixed(5)}</div></div>
          <div class="card"><div class="label">Bosco</div><div class="value">${bosco==="auto"?"Non specificato":bosco==="castagno"?"Castagno/Quercia":bosco==="faggio"?"Faggio":"Abete"}</div></div>
          <div class="card"><div class="label">Esposizione</div><div class="value">${esposizione==="auto"?"Non specificata":esposizione.toUpperCase()}</div></div>
        </div>

        <div class="box blue">
          <h3>🌡️ Controllo termico 4 / 7 giorni</h3>
          <div class="grid">
            <div class="card"><div class="label">Media temperatura 4 gg</div><div class="value">${fmt(temp4)} °C</div></div>
            <div class="card"><div class="label">Media temperatura 7 gg</div><div class="value">${fmt(temp7)} °C</div></div>
            <div class="card"><div class="label">Media massime 4 gg</div><div class="value">${fmt(max4)} °C</div></div>
            <div class="card"><div class="label">Media minime 4 gg</div><div class="value">${fmt(min4)} °C</div></div>
            <div class="card"><div class="label">Media massime 7 gg</div><div class="value">${fmt(max7)} °C</div></div>
            <div class="card"><div class="label">Media minime 7 gg</div><div class="value">${fmt(min7)} °C</div></div>
          </div>
        </div>

        <div class="box ${zonaClass}">
          <h3>🌱 Gradimento termico del terreno</h3>
          <div class="grid">
            <div class="card"><div class="label">Terreno 0–7 cm</div><div class="value">${fmt(soil0Corretto)} °C</div></div>
            <div class="card"><div class="label">Terreno 7–28 cm</div><div class="value">${fmt(soil1Corretto)} °C</div></div>
            <div class="card"><div class="label">Umidità 0–7 cm</div><div class="value">${Number.isFinite(moist0)?fmt(moist0*100,0)+" %":"N/D"}</div></div>
            <div class="card"><div class="label">Umidità 7–28 cm</div><div class="value">${Number.isFinite(moist1)?fmt(moist1*100,0)+" %":"N/D"}</div></div>
          </div>
          <div class="big">${zonaTerreno}</div>
          <p class="small">Il dato del terreno è modellato/reanalizzato, non la lettura di un termometro fisicamente presente nel bosco. La correzione di −1 °C è applicata solo se hai selezionato Faggeta/Abetaia.</p>
        </div>

        <div class="box">
          <h3>⛰️ Finestra termica e quota equivalente</h3>
          <p>Specie selezionata: <b>${specie==="edulis"?"Edulis / Rosso":"Aestivalis"}</b> — intervallo ${termMin}–${termMax} °C</p>
          <p>Riferimento Montevarchi: <b>${MONTEVARCHI_QUOTA} m</b> • gradiente: <b>−${GRADIENTE_TERMICO} °C / 100 m</b></p>
          <div class="grid">
            <div class="card"><div class="label">Quota equivalente al limite alto (${termMax} °C)</div><div class="value">${Number.isFinite(q1)?Math.round(q1)+" m":"N/D"}</div></div>
            <div class="card"><div class="label">Quota equivalente al limite basso (${termMin} °C)</div><div class="value">${Number.isFinite(q2)?Math.round(q2)+" m":"N/D"}</div></div>
            <div class="card"><div class="label">Correzione esposizione</div><div class="value">${corrExp?corrExp+" m":"0 m"}</div></div>
            <div class="card"><div class="label">Quota termica del punto</div><div class="value">${Number.isFinite(altitudine)?Math.round(altitudine-corrExp)+" m":"N/D"}</div></div>
          </div>
          <p class="small">La fascia è un calcolo termico indicativo basato sul gradiente impostato; non equivale a una misura della temperatura effettiva del bosco.</p>
        </div>

        <div class="box">
          <h3>🍄 Timer biologico del micelio</h3>
          <div class="grid">
            <div class="card"><div class="label">Pioggia ultimi 3 giorni</div><div class="value">${fmt(rain3)} mm</div></div>
            <div class="card"><div class="label">Pioggia ultimi 7 giorni</div><div class="value">${fmt(rain7)} mm</div></div>
            <div class="card"><div class="label">Pioggia ultimi 14 giorni</div><div class="value">${fmt(rain14)} mm</div></div>
            <div class="card"><div class="label">Ultimo Giorno 0</div><div class="value">${ciclo.ultimoEvento?formatData(ciclo.ultimoEvento):"N/D"}</div></div>
          </div>
          <div class="status ${timerClasse}">${timerTesto}</div>
          <p class="small">Evento pioggia iniziale impostato a ≥ ${ciclo.SOGLIA_PIOGGIA_EVENTO} mm/giorno. È una soglia tecnica iniziale modificabile nel codice, non un valore biologico dimostrato.</p>
          <h4>☠️ Killer del bosco</h4>${killerHtml}
        </div>

        <div class="box">
          <h3>🌳 Finestra indicativa per tipo di bosco</h3>
          <p><b>Castagno / Quercia:</b> 8–12 giorni</p>
          <p><b>Faggio / Abete:</b> 15–22 giorni</p>
          <p><b>Finestra generica primordi:</b> 14–20 giorni</p>
        </div>

        <div class="box">
          <h3>🔮 Previsione prossimi 7 giorni</h3>
          <div class="grid">
            <div class="card"><div class="label">Giorno più coerente</div><div class="value">${formatData(futureDays[bestIdx])}</div></div>
            <div class="card"><div class="label">Indice tecnico giornaliero</div><div class="value">${best}/100</div></div>
          </div>
          <div class="forecast">
          ${futureDays.map((d,i)=>`
            <div class="day ${i===bestIdx?"best":""}">
              <div class="date">${nomeGiorno(d)}<br>${formatData(d)}</div>
              <hr>
              <div class="rain">🌧️ ${fmt(futRain[i])} mm</div>
              <div>💧 ${fmt(futRh[i],0)} %</div>
              <div class="temp">🌡️ ${fmt(futTmin[i])}/${fmt(futTmax[i])} °C</div>
              <hr>
              <b>${scores[i]}/100</b>
            </div>
          `).join("")}
          </div>
        </div>

        <p class="legend">⚠️ Questo è un modello tecnico sperimentale costruito sulle regole definite nel progetto. Non rappresenta una certezza sulla nascita dei porcini. I dati del suolo forniti dall'API sono stime di modello/reanalisi e vanno distinti da una misurazione in bosco.</p>
        `;

        document.getElementById("risultato").innerHTML=html;

        const chartLabels=histDays.concat(futureDays);
        const chartRain=rain.slice(0,nHist).concat(futRain);
        const chartTemp=tmean.slice(0,nHist).concat(futureDays.map((_,i)=>(futTmin[i]+futTmax[i])/2));

        const ctx=document.getElementById("grafico");
        if(grafico) grafico.destroy();
        grafico=new Chart(ctx,{
          data:{
            labels:chartLabels,
            datasets:[
              {type:"bar",label:"Pioggia mm",data:chartRain,yAxisID:"y"},
              {type:"line",label:"Temperatura media °C",data:chartTemp,yAxisID:"y1",tension:.3}
            ]
          },
          options:{
            responsive:true,
            interaction:{mode:"index",intersect:false},
            scales:{
              y:{beginAtZero:true,title:{display:true,text:"Pioggia mm"}},
              y1:{position:"right",title:{display:true,text:"Temperatura °C"},grid:{drawOnChartArea:false}}
            }
          }
        });
    }catch(error){
        console.error(error);
        document.getElementById("risultato").innerHTML=`
          <div class="box dead">
          <h3>❌ Errore</h3>
          <p>Non è stato possibile recuperare tutti i dati.</p>
          <p>${error.message}</p>
          </div>`;
    }
}
</script>
</body>
</html>
