<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🍄 Meteo Funghi Pratomagno</title>
<script src.jsdelivr.net/npm/chart.jsscript>
'
<style>

body{
    font-family:Arial, sans-serif;
    background:#eef5ee;
    margin:0;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#1b5e20;
}

select{
    width:100%;
    padding:12px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    background:#1b5e20;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.result{
    margin-top:20px;
    padding:20px;
    background:#f4fff4;
    border-radius:10px;
}

</style>

</head>

<body>

<div class="container">

<h1>🍄 Meteo Funghi Pratomagno</h1>

<select id="localita">

<option value="43.648210837035236,11.672634310976488">Pozza Nera</option>

<option value="43.61493048759856,11.69405168018871">Monte Lori Pic Nic</option>

<option value="43.60871375792392,11.705157764789897">Monte Lori Campeggio</option>

<option value="43.620597527331924,11.657856370237369">Tre Fonti</option>

<option value="43.619602322842674,11.65123576223233">Trappola</option>

<option value="43.61273877340515,11.656966725681125">Trevane</option>

<option value="43.50398069862869,11.545716077300723">Cocioni</option>

<option value="43.48898753383693,11.512202978459452">Moncioni</option>

<option value="43.52542199979008,11.522390226279295">Cavriglia Quercie</option>

<option value="43.52070302717631,11.502276149076717">Cavriglia Alta</option>

<option value="43.46761467459521,11.670888620816104">Pergine Valdarno</option>

<option value="43.53632378809326,11.625183736328342">Tasso Lore</option>

</select>

<button onclick="analizza()">

Analizza Località

</button>

<div class="result" id="risultato">

Seleziona una località e premi "Analizza Località"

</div>
<div class="result">
<h3>Grafico Meteo</h3>
<canvas id="grafico"></canvas>

</div>

<script>
let grafico = null;
async function analizza(){

const coordinate =
document.getElementById("localita").value;

const parti =
coordinate.split(",");

const lat = parti[0];
const lon = parti[1];

document.getElementById("risultato").innerHTML =
"⏳ Recupero dati meteo...";

try{

const url =
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto`;

const risposta =
await fetch(url);

const dati =
await risposta.json();

const pioggia =
dati.daily.precipitation_sum[0];

const tempMax =
dati.daily.temperature_2m_max[0];

const tempMin =
dati.daily.temperature_2m_min[0];
let indicePorcino =

Math.round(

(pioggia * 5) +

((20-tempMax) * 4)
5
);

if(indicePorcino > 100)

indicePorcino = 100;

if(indicePorcino < 0)

indicePorcino = 0;

let indiceOvulo =

Math.round(

(tempMax * 3) +

(pioggia * 2)

);

if(indiceOvulo > 100)

indiceOvulo = 100;
document.getElementById("risultato").innerHTML =

`
document.getElementById("risultato").innerHTML =

`

<h2>Dati Meteo</h2>

<p>🌧️ Pioggia prevista: <b>${pioggia} mm</b></p>

<p>🌡️ Temperatura massima: <b>${tempMax} °C</b></p>


<p>🌡️ Temperatura minima: <b>${tempMin} °C</b></p>

<hr>

<p>🍄 Indice Porcino: <b>${indicePorcino}/100</b></p>

<p>🥚 Indice Ovulo: <b>${indiceOvulo}/100</b></p>

`;
const ctx =
document.getElementById("grafico");

if(grafico){

grafico.destroy();
}
grafico = new Chart(ctx,{

type:'bar',

data:{

labels:[

'Pioggia',

'Temp Max',

'Temp Min',

'Porcino',

'Ovulo'

],
datasets:[{

label:'Analisi Micologica',

data:[

pioggia,

tempMax,

tempMin,

indicePorcino,

indiceOvulo
],

backgroundColor:[

'blue',

'red',

'orange',

'brown',

'gold'

]

}]

}

});

}
catch(errore){

document.getElementById("risultato").innerHTML =
"❌ Errore nel recupero dati";

}

}

</script>

</body>
</html>
