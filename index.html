</div> <script>
let grafico = null;

/* ================================
FUNZIONI UTILI
================================ */

function clamp(numero,min,max){

return Math.max(min,Math.min(max,numero));
}

function classeIndice(indice){

if(indice >= 75) return "good";
if(indice >= 50) return "medium";
return "bad";
}

function nomeGiorno(data){

const giorni = [
    "Dom",
    "Lun",
    "Mar",
    "Mer",
    "Gio",
    "Ven",
    "Sab"
];
return giorni[new Date(data).getDay()];
}

function formatData(data){

const d = new Date(data);
return d.toLocaleDateString(
    "it-IT",
    {
        day:"2-digit",
        month:"2-digit"
    }
);
}

/* ================================
ALTITUDINE
================================ */

async function recuperaAltitudine(lat,lon){

const url =
`https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lon}`;
const risposta = await fetch(url);
if(!risposta.ok){
    throw new Error(
        "Errore recupero altitudine"
    );
}
const dati = await risposta.json();
if(
    !dati.elevation ||
    dati.elevation.length === 0
){
    return null;
}
return dati.elevation[0];
}

/* ================================
ANALISI
================================ */

async function analizza(){

const select =
document.getElementById("localita");
const coordinate =
select.value;
const nomeLocalita =
select.options[select.selectedIndex].text;
const parti =
coordinate.split(",");
const lat =
parseFloat(parti[0]);
const lon =
parseFloat(parti[1]);
document.getElementById("risultato").innerHTML =
`<div class="loading">
⏳ Recupero dati meteo e altitudine...
</div>`;
try{
    /* ================================
       DATE
    ================================= */
    const oggi = new Date();
    const fine =
    oggi.toISOString().split("T")[0];
    const inizioData =
    new Date();
    inizioData.setDate(
        inizioData.getDate()-20
    );
    const start =
    inizioData.toISOString().split("T")[0];
    /* ================================
       ALTITUDINE
    ================================= */
    const altitudine =
    await recuperaAltitudine(
        lat,
        lon
    );
    /* ================================
       STORICO
    ================================= */
    const urlStorico =
    `https://archive-api.open-meteo.com/v1/archive?`+
    `latitude=${lat}`+
    `&longitude=${lon}`+
    `&start_date=${start}`+
    `&end_date=${fine}`+
    `&daily=`+
    `temperature_2m_mean,`+
    `precipitation_sum,`+
    `relative_humidity_2m_mean`+
    `&timezone=auto`;
    const rispostaStorico =
    await fetch(urlStorico);
    if(!rispostaStorico.ok){
        throw new Error(
            "Errore dati storici"
        );
    }
    const storico =
    await rispostaStorico.json();
    const giorniStorico =
    storico.daily.time;
    const pioggiaStorico =
    storico.daily.precipitation_sum;
    const temperaturaStorico =
    storico.daily.temperature_2m_mean;
    const umiditaStorico =
    storico.daily.relative_humidity_2m_mean;
    /* ================================
       CALCOLO STORICO
    ================================= */
    let pioggia20 = 0;
    let pioggia14 = 0;
    let pioggia7 = 0;
    let pioggia3 = 0;
    let tempSomma = 0;
    let umiditaSomma = 0;
    let giorniValidi = 0;
    for(
        let i=0;
        i<pioggiaStorico.length;
        i++
    ){
        const pioggia =
        pioggiaStorico[i] || 0;
        const temp =
        temperaturaStorico[i];
        const umidita =
        umiditaStorico[i];
        pioggia20 += pioggia;
        if(i >= pioggiaStorico.length-14){
            pioggia14 += pioggia;
        }
        if(i >= pioggiaStorico.length-7){
            pioggia7 += pioggia;
        }
        if(i >= pioggiaStorico.length-3){
            pioggia3 += pioggia;
        }
        if(temp !== null){
            tempSomma += temp;
        }
        if(umidita !== null){
            umiditaSomma += umidita;
        }
        if(
            temp !== null &&
            umidita !== null
        ){
            giorniValidi++;
        }
    }
    const tempMedia =
    giorniValidi > 0
    ?
    tempSomma/giorniValidi
    :
    0;
    const umiditaMedia =
    giorniValidi > 0
    ?
    umiditaSomma/giorniValidi
    :
    0;
    /* ================================
       PREVISIONE
    ================================= */
    const urlForecast =
    `https://api.open-meteo.com/v1/forecast?`+
    `latitude=${lat}`+
    `&longitude=${lon}`+
    `&forecast_days=7`+
    `&daily=`+
    `temperature_2m_max,`+
    `temperature_2m_min,`+
    `precipitation_sum,`+
    `precipitation_probability_max,`+
    `relative_humidity_2m_mean`+
    `&timezone=auto`;
    const rispostaForecast =
    await fetch(urlForecast);
    if(!rispostaForecast.ok){
        throw new Error(
            "Errore dati previsionali"
        );
    }
    const forecast =
    await rispostaForecast.json();
    const giorniForecast =
    forecast.daily.time;
    const pioggiaForecast =
    forecast.daily.precipitation_sum;
    const probPioggia =
    forecast.daily.precipitation_probability_max;
    const tempMax =
    forecast.daily.temperature_2m_max;
    const tempMin =
    forecast.daily.temperature_2m_min;
    const umiditaForecast =
    forecast.daily.relative_humidity_2m_mean;
    /* ================================
       PIOGGIA FUTURA
    ================================= */
    let pioggiaFutura = 0;
    for(
        let i=0;
        i<pioggiaForecast.length;
        i++
    ){
        pioggiaFutura +=
        pioggiaForecast[i] || 0;
    }
    /* ================================
       INDICE STORICO
       La pioggia recente pesa
       più di quella vecchia.
    ================================= */
    let scorePioggiaRecente = 0;
    if(pioggia3 >= 15){
        scorePioggiaRecente += 35;
    }
    else if(pioggia3 >= 8){
        scorePioggiaRecente += 25;
    }
    else if(pioggia3 >= 3){
        scorePioggiaRecente += 12;
    }
    if(pioggia7 >= 25){
        scorePioggiaRecente += 20;
    }
    else if(pioggia7 >= 15){
        scorePioggiaRecente += 12;
    }
    else if(pioggia7 >= 8){
        scorePioggiaRecente += 6;
    }
    /* ================================
       UMIDITÀ
    ================================= */
    let scoreUmidita = 0;
    if(umiditaMedia >= 85){
        scoreUmidita = 20;
    }
    else if(umiditaMedia >= 75){
        scoreUmidita = 15;
    }
    else if(umiditaMedia >= 65){
        scoreUmidita = 8;
    }
    /* ================================
       TEMPERATURA
       Fascia indicativa.
    ================================= */
    let scoreTemperatura = 0;
    if(
        tempMedia >= 10 &&
        tempMedia <= 18
    ){
        scoreTemperatura = 15;
    }
    else if(
        tempMedia >= 8 &&
        tempMedia <= 21
    ){
        scoreTemperatura = 8;
    }
    /* ================================
       ALTITUDINE
       Peso molto leggero:
       non vogliamo far decidere
       l'altitudine da sola.
    ================================= */
    let scoreAltitudine = 0;
    if(altitudine !== null){
        if(
            altitudine >= 500 &&
            altitudine <= 1200
        ){
            scoreAltitudine = 5;
        }
        else if(
            altitudine >= 300 &&
            altitudine <= 1400
        ){
            scoreAltitudine = 3;
        }
    }
    /* ================================
       INDICE PORCINO
    ================================= */
    let indicePorcino =
    scorePioggiaRecente +
    scoreUmidita +
    scoreTemperatura +
    scoreAltitudine;
    indicePorcino =
    clamp(
        Math.round(indicePorcino),
        0,
        100
    );
    /* ================================
       INDICE OVULO
       Più orientato a temperatura
       e umidità.
    ================================= */
    let indiceOvulo = 0;
    if(
        tempMedia >= 14 &&
        tempMedia <= 21
    ){
        indiceOvulo += 40;
    }
    else if(
        tempMedia >= 11 &&
        tempMedia <= 24
    ){
        indiceOvulo += 25;
    }
    if(umiditaMedia >= 80){
        indiceOvulo += 30;
    }
    else if(umiditaMedia >= 70){
        indiceOvulo += 20;
    }
    if(pioggia7 >= 15){
        indiceOvulo += 20;
    }
    else if(pioggia7 >= 7){
        indiceOvulo += 10;
    }
    indiceOvulo =
    clamp(
        Math.round(indiceOvulo),
        0,
        100
    );
    /* ================================
       FINESTRA FUTURA
       Calcoliamo un punteggio
       per ogni giorno.
    ================================= */
    let punteggiGiornalieri = [];
    for(
        let i=0;
        i<giorniForecast.length;
        i++
    ){
        const pioggia =
        pioggiaForecast[i] || 0;
        const umidita =
        umiditaForecast[i] || 0;
        const tmax =
        tempMax[i] || 0;
        const tmin =
        tempMin[i] || 0;
        const tempMediaGiorno =
        (tmax+tmin)/2;
        let score = 0;
        /* pioggia */
        if(
            pioggia >= 5 &&
            pioggia <= 30
        ){
            score += 30;
        }
        else if(pioggia >= 2){
            score += 18;
        }
        /* umidità */
        if(umidita >= 85){
            score += 25;
        }
        else if(umidita >= 75){
            score += 18;
        }
        else if(umidita >= 65){
            score += 8;
        }
        /* temperatura */
        if(
            tempMediaGiorno >= 10 &&
            tempMediaGiorno <= 18
        ){
            score += 30;
        }
        else if(
            tempMediaGiorno >= 8 &&
            tempMediaGiorno <= 21
        ){
            score += 18;
        }
        /* probabilità pioggia */
        if(probPioggia[i] >= 70){
            score += 10;
        }
        else if(probPioggia[i] >= 40){
            score += 5;
        }
        /* piccolo contributo altitudine */
        if(
            altitudine !== null &&
            altitudine >= 500 &&
            altitudine <= 1200
        ){
            score += 5;
        }
        score =
        clamp(
            Math.round(score),
            0,
            100
        );
        punteggiGiornalieri.push(score);
    }
    /* ================================
       MIGLIOR GIORNO
    ================================= */
    let migliorIndice =
    Math.max(...punteggiGiornalieri);
    let migliorPosizione =
    punteggiGiornalieri.indexOf(
        migliorIndice
    );
    let migliorGiorno =
    giorniForecast[migliorPosizione];
    /* ================================
       COSTRUZIONE FINESTRA
    ================================= */
    let giorniFavorevoli = [];
    for(
        let i=0;
        i<punteggiGiornalieri.length;
        i++
    ){
        if(
            punteggiGiornalieri[i] >= 65
        ){
            giorniFavorevoli.push(
                giorniForecast[i]
            );
        }
    }
    let testoFinestra =
    "🔴 Al momento non emerge una finestra particolarmente favorevole.";
    if(giorniFavorevoli.length > 0){
        const primo =
        formatData(giorniFavorevoli[0]);
        const ultimo =
        formatData(
            giorniFavorevoli[
                giorniFavorevoli.length-1
            ]
        );
        testoFinestra =
        `🟢 <b>Finestra favorevole stimata:
        ${primo} → ${ultimo}</b>`;
    }
    /* ================================
       SEMAFORO
    ================================= */
    let semaforo;
    if(indicePorcino >= 75){
        semaforo =
        "🟢🟢 CONDIZIONI MOLTO FAVOREVOLI";
    }
    else if(indicePorcino >= 55){
        semaforo =
        "🟢 CONDIZIONI INTERESSANTI";
    }
    else if(indicePorcino >= 35){
        semaforo =
        "🟡 CONDIZIONI DISCRETE";
    }
    else{
        semaforo =
        "🔴 CONDIZIONI POCO FAVOREVOLI";
    }
    /* ================================
       HTML RISULTATO
    ================================= */
    let html = `
    <h2>${semaforo}</h2>
    <h3>📍 ${nomeLocalita}</h3>
    <div class="info-grid">
        <div class="info-card">
            <div class="label">
            Latitudine
            </div>
            <div class="value">
            ${lat.toFixed(6)}
            </div>
        </div>
        <div class="info-card">
            <div class="label">
            Longitudine
            </div>
            <div class="value">
            ${lon.toFixed(6)}
            </div>
        </div>
        <div class="info-card">
            <div class="label">
            Altitudine
            </div>
            <div class="value">
            ${
                altitudine !== null
                ?
                Math.round(altitudine)+" m"
                :
                "N/D"
            }
            </div>
        </div>
    </div>
    <h3>🌧️ Situazione recente</h3>
    <div class="info-grid">
        <div class="info-card">
            <div class="label">
            Pioggia ultimi 3 giorni
            </div>
            <div class="value">
            ${pioggia3.toFixed(1)} mm
            </div>
        </div>
        <div class="info-card">
            <div class="label">
            Pioggia ultimi 7 giorni
            </div>
            <div class="value">
            ${pioggia7.toFixed(1)} mm
            </div>
        </div>
        <div class="info-card">
            <div class="label">
            Pioggia ultimi 14 giorni
            </div>
            <div class="value">
            ${pioggia14.toFixed(1)} mm
            </div>
        </div>
        <div class="info-card">
            <div class="label">
            Pioggia ultimi 20 giorni
            </div>
            <div class="value">
            ${pioggia20.toFixed(1)} mm
            </div>
        </div>
        <div class="info-card">
            <div class="label">
            Temperatura media
            </div>
            <div class="value">
            ${tempMedia.toFixed(1)} °C
            </div>
        </div>
        <div class="info-card">
            <div class="label">
            Umidità media
            </div>
            <div class="value">
            ${umiditaMedia.toFixed(0)} %
            </div>
        </div>
    </div>
    <div class="index-box">
        <div>
        🍄 <b>Indice Porcino</b>
        </div>
        <div class="index-number ${classeIndice(indicePorcino)}">
        ${indicePorcino}/100
        </div>
    </div>
    <div class="index-box">
        <div>
        🥚 <b>Indice Ovulo</b>
        </div>
        <div class="index-number ${classeIndice(indiceOvulo)}">
        ${indiceOvulo}/100
        </div>
    </div>
    <hr>
    <h3>🔮 Previsione prossimi 7 giorni</h3>
    <div class="info-grid">
        <div class="info-card">
            <div class="label">
            Pioggia prevista
            </div>
            <div class="value">
            ${pioggiaFutura.toFixed(1)} mm
            </div>
        </div>
        <div class="info-card">
            <div class="label">
            Giorno migliore
            </div>
            <div class="value">
            ${formatData(migliorGiorno)}
            </div>
        </div>
        <div class="info-card">
            <div class="label">
            Indice giorno migliore
            </div>
            <div class="value good">
            ${migliorIndice}/100
            </div>
        </div>
    </div>
    <div class="finestra">
    ${testoFinestra}
    <br><br>
    ⭐ Giorno più interessante:
    <b>${formatData(migliorGiorno)}</b>
    con indice
    <b>${migliorIndice}/100</b>
    </div>
    <h3>📅 Analisi giorno per giorno</h3>
    <div class="forecast-grid">
    `;
    /* ================================
       CARD PREVISIONI
    ================================= */
    for(
        let i=0;
        i<giorniForecast.length;
        i++
    ){
        const best =
        i === migliorPosizione
        ?
        "best"
        :
        "";
        html += `
        <div class="day-card ${best}">
            <div class="date">
            ${nomeGiorno(giorniForecast[i])}
            <br>
            ${formatData(giorniForecast[i])}
            </div>
            <hr>
            <div class="rain">
            🌧️
            ${(pioggiaForecast[i] || 0).toFixed(1)}
            mm
            </div>
            <div>
            💧
            ${(umiditaForecast[i] || 0).toFixed(0)}
            %
            </div>
            <div class="temp">
            🌡️
            ${(tempMin[i] || 0).toFixed(1)}
            /
            ${(tempMax[i] || 0).toFixed(1)}
            °C
            </div>
            <div>
            ☔
            ${probPioggia[i] || 0}%
            </div>
            <hr>
            <div class="score">
            ${punteggiGiornalieri[i]}/100
            </div>
        </div>
        `;
    }
    html += `
    </div>
    <p class="legend">
    🟢 ≥75 condizioni molto interessanti •
    🟡 50–74 condizioni intermedie •
    🔴 &lt;50 condizioni deboli
    </p>
    <p style="font-size:13px;color:#777">
    ⚠️ L'indice rappresenta un modello indicativo delle
    condizioni meteorologiche favorevoli alla fruttificazione.
    Non costituisce una previsione certa della nascita dei funghi.
    </p>
    `;
    document.getElementById("risultato").innerHTML =
    html;
    /* ================================
       GRAFICO
    ================================= */
    const labels =
    [
        ...giorniStorico,
        ...giorniForecast
    ];
    const pioggiaGrafico =
    [
        ...pioggiaStorico,
        ...pioggiaForecast
    ];
    const temperaturaGrafico =
    [
        ...temperaturaStorico,
        ...tempMax.map(
            (v,i) =>
            (
                v + tempMin[i]
            ) / 2
        )
    ];
    const backgroundPioggia =
    labels.map(
        (_,i) =>
        i < giorniStorico.length
        ?
        "rgba(33,150,243,0.45)"
        :
        "rgba(76,175,80,0.45)"
    );
    const ctx =
    document.getElementById("grafico");
    if(grafico){
        grafico.destroy();
    }
    grafico = new Chart(
        ctx,
        {
            type:"bar",
            data:{
                labels:labels,
                datasets:[
                    {
                        label:"Pioggia mm",
                        data:pioggiaGrafico,
                        backgroundColor:
                        backgroundPioggia,
                        borderColor:
                        "#1565c0",
                        borderWidth:1,
                        yAxisID:"y"
                    },
                    {
                        label:"Temperatura °C",
                        data:temperaturaGrafico,
                        type:"line",
                        borderColor:"#d32f2f",
                        backgroundColor:
                        "rgba(211,47,47,0.1)",
                        tension:0.35,
                        fill:false,
                        yAxisID:"y1"
                    }
                ]
            },
            options:{
                responsive:true,
                interaction:{
                    mode:"index",
                    intersect:false
                },
                scales:{
                    y:{
                        beginAtZero:true,
                        position:"left",
                        title:{
                            display:true,
                            text:"Pioggia mm"
                        }
                    },
                    y1:{
                        position:"right",
                        title:{
                            display:true,
                            text:"Temperatura °C"
                        },
                        grid:{
                            drawOnChartArea:false
                        }
                    }
                }
            }
        }
    );
}
catch(error){
    console.error(error);
    document.getElementById("risultato").innerHTML =
    `
    <h3>❌ Errore</h3>
    <p>
    Non è stato possibile recuperare
    i dati meteorologici.
    </p>
    <p>
    ${error.message}
    </p>
    `;
}
}

</script> </body> </html>
