<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🍄 Meteo Funghi Pratomagno</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background-image:url("https://images.unsplash.com/photo-1506744038136-46273834b3fb");
    
    background-size:cover;

    background-position:center;

    background-attachment:fixed;
    
    margin:0;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:rgba(255,255,255,0.92);
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 30px rgba(0,0,0,.15);
    backdrop-filter:blur(5px);
}

h1{
    text-align:center;
    color:#1b5e20;
}

select{
    width:100%;
    padding:12px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    background:#1b5e20;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.result{
    margin-top:20px;
    padding:20px;
    background:#f4fff4;
    border-radius:10px;
}

canvas{
    margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<h1>🍄 Previsioni Porcini/Ovuli Valdarno</h1>

<p style="text-align:center;font-size:18px;color:#555;">

Valdarno • Pratomagno • Monticiano • Siena

</p>

<select id="localita">

<option value="43.648210837035236,11.672634310976488">Pozza Nera</option>
<option value="43.61493048759856,11.69405168018871">Monte Lori Pic Nic</option>
<option value="43.60871375792392,11.705157764789897">Monte Lori Campeggio</option>
<option value="43.620597527331924,11.657856370237369">Tre Fonti</option>
<option value="43.619602322842674,11.65123576223233">Trappola</option>
<option value="43.61273877340515,11.656966725681125">Trevane</option>
<option value="43.50398069862869,11.545716077300723">Cocioni</option>
<option value="43.48898753383693,11.512202978459452">Moncioni</option>
<option value="43.52542199979008,11.522390226279295">Cavriglia Quercie</option>
<option value="43.52070302717631,11.502276149076717">Cavriglia Alta</option>
<option value="43.46761467459521,11.670888620816104">Pergine Valdarno</option>
<option value="43.53632378809326,11.625183736328342">Tasso Lore</option>

</select>

<button onclick="analizza()">
Analizza Località
</button>

<div id="risultato" class="result">

Seleziona una località e premi "Analizza Località"

</div>

<canvas id="grafico"></canvas>


<script>

let grafico = null;

async function analizza(){

const coordinate =
document.getElementById("localita").value;

const parti =
coordinate.split(",");

const lat = parti[0];
const lon = parti[1];

document.getElementById("risultato").innerHTML =
"⏳ Recupero dati meteo...";

try{

const oggi = new Date();

const fine =
oggi.toISOString().split("T")[0];

const inizio = new Date();

inizio.setDate(
inizo.getDate()-20
);

const start =
inizio.toISOString().split('T')[0];

const url =

`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${start}&end_date=${fine}&daily=temperature_2m_mean,precipitation_sum&timezone=auto`;

const risposta = await fetch(url);

const dati = await risposta.json();

const giorni =

dati.daily.time;

const precipitazioni =

dati.daily.precipitation_sum;

const temperature =

dati.daily.temperature_2m_mean;

``

let pioggiaTotale = 0;

for(let p of precipitazioni){

pioggiaTotale += p;

}

let tempMedia = 0;

for(let t of temperature){

tempMedia += t;

}

tempMedia =

(tempMedia /

temperature.length)

.toFixed(1);
let indicePorcino =

Math.round(

(pioggiaTotale * 0.7)

+

((22-tempMedia)*5)

);

indicePorcino =
Math.max(0,Math.min(100,indicePorcino));

let indiceOvulo =

Math.round(

(tempMedia * 3)

+

(pioggiaTotale * 0.3)
    
);

indiceOvulo =
Math.max(0,Math.min(100,indiceOvulo));

let semaforo = "🔴 SCARSO";

if(indicePorcino >= 80){

semaforo = "🟢🟢 ECCELLENTE";

}

else if(indicePorcino >= 60){

semaforo = "🟢 BUONO";

}
else if(indicePorcino >= 40){

semaforo = "🟡 DISCRETO";

}

let uscita = "Ancora presto";

if(indicePorcino >= 80){

uscita = "🍄 Buttata probabile entro 2-5 giorni";

}

else if(indicePorcino >= 60){
uscita = "🍄 Controllare entro 5-7 giorni";

}
document.getElementById("risultato").innerHTML =

`
<h2>${semaforo}</h2>

<p>
🌧️ Pioggia ultimi 20 giorni:
<b>${pioggiaTotale.toFixed(1)} mm</b>
</p>

<p>
🌡️ Temperatura media:
<b>${tempMedia} °C</b>
</p>

<hr>

<p>
🍄 Indice Porcino:
<b>${indicePorcino}/100</b>
</p>

<p>
🥚 Indice Ovulo:
<b>${indiceOvulo}/100</b>
</p>

<h3>${uscita}</h3>

`;

const ctx =
document.getElementById("grafico");

if(grafico){
grafico.destroy();
}

grafico = new Chart(ctx,{

type:"bar",

data:{
labels:giorni,

datasets:[{
label:"Analisi Micologica",

data:[

{
label:"Pioggia (mm)",

data:precipitazioni,

borderColor:"blue",

backgroundColor:"rgba(0,0,255,0.3)",

fill:true,

tension:0.4

},

{
label:"Temperatura °C",

data:temperature,

borderColor:"red",

backgroundColor:"rgba(255,0,0,0.2)",

fill:true,

tension:0.4

}

],

backgroundColor:[
"blue",
"red",
"orange",
"brown",
"gold"
]
}]
},

options:{
responsive:true
}

});

}
catch(error){

console.error(error);

document.getElementById("risultato").innerHTML =

"❌ Errore nel recupero dati meteo" + error.message;

}

}

</script>

</body>
</html>
