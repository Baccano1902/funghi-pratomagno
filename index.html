<script>
let grafico = null;

/* =========================================================
   IMPOSTAZIONI DEL MODELLO
   ========================================================= */

const MODELLO = {
    giorniStorico: 45,

    // Soglia per definire un evento di pioggia significativo.
    pioggiaEventoMin: 15,

    // Finestra usata per accumulare la pioggia attorno a un evento.
    finestraPioggiaEvento: 3,

    // Finestre temporali empiriche indicate dall'utente.
    estateMin: 12,
    estateMax: 14,

    autunnoMin: 15,
    autunnoMax: 18,

    // Mesi indicativamente estivi/autunnali.
    mesiEstate: [5,6,7,8],      // giugno-settembre
    mesiAutunno: [8,9,10,11]    // settembre-dicembre
};


/* =========================================================
   FUNZIONI GENERALI
   ========================================================= */

function clamp(numero,min,max){
    return Math.max(min,Math.min(max,numero));
}

function classeIndice(indice){
    if(indice >= 75) return "good";
    if(indice >= 50) return "medium";
    return "bad";
}

function semaforoIndice(indice){
    if(indice >= 80) return "🟢🟢 FINESTRA MOLTO INTERESSANTE";
    if(indice >= 65) return "🟢 CONDIZIONI INTERESSANTI";
    if(indice >= 45) return "🟡 CONDIZIONI INTERMEDIE";
    return "🔴 CONDIZIONI DEBOLI";
}

function nomeGiorno(data){
    const giorni=["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
    return giorni[new Date(data+"T00:00:00").getDay()];
}

function formatData(data){
    const d=new Date(data+"T00:00:00");
    return d.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit"});
}

function formatDataCompleta(data){
    const d=new Date(data+"T00:00:00");
    return d.toLocaleDateString("it-IT",{
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
    });
}

function dataLocaleISO(data){
    const d=new Date(data);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function differenzaGiorni(data1,data2){
    const a=new Date(data1+"T00:00:00");
    const b=new Date(data2+"T00:00:00");
    return Math.round((b-a)/86400000);
}

function dataAggiungiGiorni(data,giorni){
    const d=new Date(data+"T00:00:00");
    d.setDate(d.getDate()+giorni);
    return dataLocaleISO(d);
}

function valore(v){
    return v === null || v === undefined || Number.isNaN(v) ? null : Number(v);
}


/* =========================================================
   ALTITUDINE
   ========================================================= */

async function recuperaAltitudine(lat,lon){
    const url=`https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lon}`;

    const risposta=await fetch(url);
    if(!risposta.ok) throw new Error("Errore recupero altitudine");

    const dati=await risposta.json();

    if(!dati.elevation || dati.elevation.length===0){
        return null;
    }

    return dati.elevation[0];
}


/* =========================================================
   TROVA EVENTI DI PIOGGIA
   =========================================================
   Cerchiamo gli eventi importanti nello storico.

   Un evento viene considerato significativo quando:
   - nei 3 giorni centrati sull'evento raggiunge almeno 15 mm;
   - prendiamo come data dell'evento il giorno con più pioggia
     all'interno del piccolo episodio.
   ========================================================= */

function trovaEventiPioggia(giorni,piogge,temperature,umidita){

    const eventi=[];

    for(let i=1;i<giorni.length-1;i++){

        let accumulo=0;

        for(let j=Math.max(0,i-1);j<=Math.min(piogge.length-1,i+1);j++){
            accumulo += valore(piogge[j]) || 0;
        }

        if(accumulo < MODELLO.pioggiaEventoMin) continue;

        const pioggiaGiorno=valore(piogge[i]) || 0;

        // Consideriamo principalmente un massimo locale,
        // evitando di creare troppi eventi duplicati.
        const pioggiaPrima=valore(piogge[i-1]) || 0;
        const pioggiaDopo=valore(piogge[i+1]) || 0;

        if(pioggiaGiorno < pioggiaPrima && pioggiaGiorno < pioggiaDopo){
            continue;
        }

        const dataEvento=giorni[i];

        // Evita eventi troppo ravvicinati.
        const ultimo=eventi[eventi.length-1];

        if(ultimo && differenzaGiorni(ultimo.data,dataEvento)<4){
            if(accumulo > ultimo.pioggia){
                ultimo.data=dataEvento;
                ultimo.pioggia=accumulo;
                ultimo.indice=i;
            }
            continue;
        }

        // Temperatura media dei 2 giorni prima.
        let tempPrima=[];
        for(let j=Math.max(0,i-2);j<i;j++){
            if(valore(temperature[j])!==null){
                tempPrima.push(valore(temperature[j]));
            }
        }

        // Temperatura media del giorno evento e del giorno dopo.
        let tempDopo=[];
        for(let j=i;j<=Math.min(temperature.length-1,i+1);j++){
            if(valore(temperature[j])!==null){
                tempDopo.push(valore(temperature[j]));
            }
        }

        const mediaPrima=tempPrima.length
            ? tempPrima.reduce((a,b)=>a+b,0)/tempPrima.length
            : null;

        const mediaDopo=tempDopo.length
            ? tempDopo.reduce((a,b)=>a+b,0)/tempDopo.length
            : null;

        const shock=mediaPrima!==null && mediaDopo!==null
            ? mediaPrima-mediaDopo
            : 0;

        eventi.push({
            data:dataEvento,
            pioggia:accumulo,
            indice:i,
            temperaturaPrima:mediaPrima,
            temperaturaDopo:mediaDopo,
            shock:shock
        });
    }

    return eventi;
}


/* =========================================================
   PUNTEGGIO SHOCK TERMICO
   ========================================================= */

function scoreShock(shock){

    if(shock >= 5) return 15;
    if(shock >= 4) return 14;
    if(shock >= 3) return 12;
    if(shock >= 2) return 7;
    if(shock >= 1) return 3;

    return 0;
}


/* =========================================================
   PUNTEGGIO ACQUA
   ========================================================= */

function scoreAcqua(pioggia){

    if(pioggia >= 30) return 25;
    if(pioggia >= 20) return 23;
    if(pioggia >= 15) return 20;
    if(pioggia >= 10) return 13;
    if(pioggia >= 5) return 7;

    return 0;
}


/* =========================================================
   PUNTEGGIO TEMPERATURA
   ========================================================= */

function scoreTemperatura(temp){

    if(temp===null) return 0;

    if(temp>=12 && temp<=18) return 15;
    if(temp>=10 && temp<=21) return 11;
    if(temp>=8 && temp<=23) return 6;

    return 0;
}


/* =========================================================
   PUNTEGGIO UMIDITÀ
   ========================================================= */

function scoreUmidita(umidita){

    if(umidita===null) return 0;

    if(umidita>=85) return 10;
    if(umidita>=78) return 8;
    if(umidita>=70) return 5;
    if(umidita>=60) return 2;

    return 0;
}


/* =========================================================
   PUNTEGGIO ALTITUDINE
   ========================================================= */

function scoreAltitudine(altitudine){

    if(altitudine===null) return 0;

    if(altitudine>=500 && altitudine<=1200) return 5;
    if(altitudine>=300 && altitudine<=1400) return 3;

    return 0;
}


/* =========================================================
   PUNTEGGIO DELLA FINESTRA TEMPORALE
   ========================================================= */

function scoreTiming(giorniDopo,tipo){

    let min=tipo==="estate"
        ? MODELLO.estateMin
        : MODELLO.autunnoMin;

    let max=tipo==="estate"
        ? MODELLO.estateMax
        : MODELLO.autunnoMax;

    if(giorniDopo>=min && giorniDopo<=max){
        return 25;
    }

    // Giorni appena prima/dopo la finestra.
    if(giorniDopo===min-1 || giorniDopo===max+1){
        return 17;
    }

    if(giorniDopo===min-2 || giorniDopo===max+2){
        return 9;
    }

    return 0;
}


/* =========================================================
   STIMA DELLA FASE DELLA FINESTRA
   ========================================================= */

function faseFinestra(giorniDopo,tipo){

    const min=tipo==="estate"
        ? MODELLO.estateMin
        : MODELLO.autunnoMin;

    const max=tipo==="estate"
        ? MODELLO.estateMax
        : MODELLO.autunnoMax;

    if(giorniDopo<min){
        return {
            testo:"⏳ IN AVVICINAMENTO",
            classe:"medium"
        };
    }

    if(giorniDopo<=max){
        return {
            testo:"🟢 FINESTRA ATTUALE",
            classe:"good"
        };
    }

    if(giorniDopo<=max+3){
        return {
            testo:"🟡 FINESTRA IN USCITA",
            classe:"medium"
        };
    }

    return {
        testo:"🔴 FINESTRA SUPERATA",
        classe:"bad"
    };
}


/* =========================================================
   ANALISI DEL MIGLIOR EVENTO RECENTE
   ========================================================= */

function trovaEventoRilevante(eventi,oggi){

    let migliore=null;
    let migliorScore=-1;

    for(const evento of eventi){

        const giorni=differenzaGiorni(evento.data,oggi);

        if(giorni<0) continue;

        const score=
            scoreAcqua(evento.pioggia)+
            scoreShock(evento.shock);

        if(score>migliorScore){
            migliorScore=score;
            migliore={...evento,giorniTrascorsi:giorni};
        }
    }

    return migliore;
}


/* =========================================================
   ANALISI PRINCIPALE
   ========================================================= */

async function analizza(){

    const btn=document.getElementById("analizzaBtn");
    btn.disabled=true;

    const select=document.getElementById("localita");
    const coordinate=select.value;
    const nomeLocalita=select.options[select.selectedIndex].text;

    const parti=coordinate.split(",");
    const lat=parseFloat(parti[0]);
    const lon=parseFloat(parti[1]);

    document.getElementById("risultato").innerHTML=
        `<div class="loading">⏳ Recupero dati meteo, altitudine e storico...</div>`;

    try{

        /* =========================
           DATE
           ========================= */

        const oggiDate=new Date();
        const oggi=dataLocaleISO(oggiDate);

        const inizioDate=new Date(oggiDate);
        inizioDate.setDate(inizioDate.getDate()-MODELLO.giorniStorico);

        const start=dataLocaleISO(inizioDate);


        /* =========================
           ALTITUDINE
           ========================= */

        const altitudine=await recuperaAltitudine(lat,lon);


        /* =========================
           STORICO
           ========================= */

        const urlStorico=
            `https://archive-api.open-meteo.com/v1/archive?`+
            `latitude=${lat}`+
            `&longitude=${lon}`+
            `&start_date=${start}`+
            `&end_date=${oggi}`+
            `&daily=`+
            `temperature_2m_mean,`+
            `precipitation_sum,`+
            `relative_humidity_2m_mean`+
            `&timezone=auto`;

        const rispostaStorico=await fetch(urlStorico);

        if(!rispostaStorico.ok){
            throw new Error("Errore dati storici");
        }

        const storico=await rispostaStorico.json();

        const giorniStorico=storico.daily.time;
        const pioggiaStorico=storico.daily.precipitation_sum;
        const temperaturaStorico=storico.daily.temperature_2m_mean;
        const umiditaStorico=storico.daily.relative_humidity_2m_mean;


        /* =========================
           TOTALI PIOGGIA
           ========================= */

        let pioggia3=0;
        let pioggia7=0;
        let pioggia14=0;
        let pioggia20=0;
        let pioggia45=0;

        for(let i=0;i<pioggiaStorico.length;i++){

            const p=valore(pioggiaStorico[i]) || 0;

            pioggia45+=p;

            if(i>=pioggiaStorico.length-3) pioggia3+=p;
            if(i>=pioggiaStorico.length-7) pioggia7+=p;
            if(i>=pioggiaStorico.length-14) pioggia14+=p;
            if(i>=pioggiaStorico.length-20) pioggia20+=p;
        }


        /* =========================
           MEDIE RECENTI
           ========================= */

        function mediaUltimi(array,n){

            const valori=array
                .slice(Math.max(0,array.length-n))
                .map(valore)
                .filter(v=>v!==null);

            if(!valori.length) return null;

            return valori.reduce((a,b)=>a+b,0)/valori.length;
        }

        const tempMedia7=mediaUltimi(temperaturaStorico,7);
        const umiditaMedia7=mediaUltimi(umiditaStorico,7);


        /* =========================
           EVENTI DI PIOGGIA
           ========================= */

        const eventi=trovaEventiPioggia(
            giorniStorico,
            pioggiaStorico,
            temperaturaStorico,
            umiditaStorico
        );

        const eventoRilevante=trovaEventoRilevante(eventi,oggi);


        /* =========================
           FORECAST 14 GIORNI
           ========================= */

        const urlForecast=
            `https://api.open-meteo.com/v1/forecast?`+
            `latitude=${lat}`+
            `&longitude=${lon}`+
            `&forecast_days=14`+
            `&daily=`+
            `temperature_2m_max,`+
            `temperature_2m_min,`+
            `precipitation_sum,`+
            `precipitation_probability_max,`+
            `relative_humidity_2m_mean`+
            `&timezone=auto`;

        const rispostaForecast=await fetch(urlForecast);

        if(!rispostaForecast.ok){
            throw new Error("Errore dati previsionali");
        }

        const forecast=await rispostaForecast.json();

        const giorniForecast=forecast.daily.time;
        const pioggiaForecast=forecast.daily.precipitation_sum;
        const probPioggia=forecast.daily.precipitation_probability_max;
        const tempMax=forecast.daily.temperature_2m_max;
        const tempMin=forecast.daily.temperature_2m_min;
        const umiditaForecast=forecast.daily.relative_humidity_2m_mean;


        /* =========================
           ANALISI EVENTO
           ========================= */

        let giorniEvento=eventoRilevante
            ? eventoRilevante.giorniTrascorsi
            : null;

        let scoreAcquaEvento=eventoRilevante
            ? scoreAcqua(eventoRilevante.pioggia)
            : 0;

        let scoreShockEvento=eventoRilevante
            ? scoreShock(eventoRilevante.shock)
            : 0;

        let timingEstate=eventoRilevante
            ? scoreTiming(giorniEvento,"estate")
            : 0;

        let timingAutunno=eventoRilevante
            ? scoreTiming(giorniEvento,"autunno")
            : 0;


        /* =========================
           INDICE GENERALE ATTUALE
           ========================= */

        const scoreTemp=scoreTemperatura(tempMedia7);
        const scoreUmid=scoreUmidita(umiditaMedia7);
        const scoreAlt=scoreAltitudine(altitudine);

        let indicePorcino=
            scoreAcquaEvento+
            scoreShockEvento+
            Math.max(timingEstate,timingAutunno)+
            scoreTemp+
            scoreUmid+
            scoreAlt;

        indicePorcino=clamp(Math.round(indicePorcino),0,100);


        /* =========================
           INDICE OVULO
           ========================= */

        let indiceOvulo=0;

        if(tempMedia7!==null){
            if(tempMedia7>=14 && tempMedia7<=21) indiceOvulo+=40;
            else if(tempMedia7>=11 && tempMedia7<=24) indiceOvulo+=25;
        }

        if(umiditaMedia7!==null){
            if(umiditaMedia7>=80) indiceOvulo+=30;
            else if(umiditaMedia7>=70) indiceOvulo+=20;
        }

        if(pioggia7>=15) indiceOvulo+=20;
        else if(pioggia7>=7) indiceOvulo+=10;

        indiceOvulo=clamp(Math.round(indiceOvulo),0,100);


        /* =========================
           CALCOLO GIORNO PER GIORNO
           ========================= */

        const punteggiGiornalieri=[];

        for(let i=0;i<giorniForecast.length;i++){

            const data=giorniForecast[i];
            const giorniDalOggi=differenzaGiorni(oggi,data);

            const p=valore(pioggiaForecast[i]) || 0;
            const um=valore(umiditaForecast[i]);
            const tmax=valore(tempMax[i]);
            const tmin=valore(tempMin[i]);

            const tm=tmax!==null && tmin!==null
                ? (tmax+tmin)/2
                : null;

            let score=0;

            // Base meteorologica.
            score+=Math.round(scoreTemperatura(tm));
            score+=Math.round(scoreUmidita(um));

            // Altitudine.
            score+=scoreAltitudine(altitudine);

            // Pioggia prevista: utile come mantenimento dell'umidità,
            // ma non sostituisce l'evento scatenante.
            if(p>=5 && p<=30) score+=10;
            else if(p>=2) score+=6;

            // Probabilità di pioggia moderata.
            const prob=valore(probPioggia[i]) || 0;
            if(prob>=70) score+=5;
            else if(prob>=40) score+=3;

            // Timing rispetto all'evento.
            if(eventoRilevante){

                const giorniDopoEvento=
                    differenzaGiorni(eventoRilevante.data,data);

                const timingE=scoreTiming(giorniDopoEvento,"estate");
                const timingA=scoreTiming(giorniDopoEvento,"autunno");

                score+=Math.max(timingE,timingA);

                // Bonus acqua se l'evento è ancora nel periodo utile.
                if(giorniDopoEvento>=8 && giorniDopoEvento<=21){
                    score+=5;
                }
            }

            punteggiGiornalieri.push(clamp(Math.round(score),0,100));
        }


        /* =========================
           MIGLIOR GIORNO
           ========================= */

        let migliorIndice=Math.max(...punteggiGiornalieri);
        let migliorPosizione=punteggiGiornalieri.indexOf(migliorIndice);
        let migliorGiorno=giorniForecast[migliorPosizione];


        /* =========================
           FINESTRE ESTATE/AUTUNNO
           ========================= */

        let finestraEstate=null;
        let finestraAutunno=null;

        if(eventoRilevante){

            const estateInizio=dataAggiungiGiorni(
                eventoRilevante.data,
                MODELLO.estateMin
            );

            const estateFine=dataAggiungiGiorni(
                eventoRilevante.data,
                MODELLO.estateMax
            );

            const autunnoInizio=dataAggiungiGiorni(
                eventoRilevante.data,
                MODELLO.autunnoMin
            );

            const autunnoFine=dataAggiungiGiorni(
                eventoRilevante.data,
                MODELLO.autunnoMax
            );

            finestraEstate={
                inizio:estateInizio,
                fine:estateFine
            };

            finestraAutunno={
                inizio:autunnoInizio,
                fine:autunnoFine
            };
        }


        /* =========================
           GIORNI FAVORITI
           ========================= */

        const giorniFavorevoli=[];

        for(let i=0;i<giorniForecast.length;i++){
            if(punteggiGiornalieri[i]>=65){
                giorniFavorevoli.push(giorniForecast[i]);
            }
        }


        /* =========================
           HTML
           ========================= */

        let html=`
        <div class="status ${classeIndice(indicePorcino)}">
            <h2>${semaforoIndice(indicePorcino)}</h2>
            <div><b>📍 ${nomeLocalita}</b></div>
            <div class="countdown">
                ${eventoRilevante
                    ? `⏱️ ${giorniEvento} giorni dall'evento`
                    : `⏱️ Nessun evento significativo recente`}
            </div>
            <div>
                Il modello usa pioggia, timing, temperatura, umidità,
                shock termico e altitudine.
            </div>
        </div>

        <h3>📍 Località</h3>

        <div class="info-grid">

            <div class="info-card">
                <div class="label">Latitudine</div>
                <div class="value">${lat.toFixed(6)}</div>
            </div>

            <div class="info-card">
                <div class="label">Longitudine</div>
                <div class="value">${lon.toFixed(6)}</div>
            </div>

            <div class="info-card">
                <div class="label">Altitudine</div>
                <div class="value">
                    ${altitudine!==null
                        ? Math.round(altitudine)+" m"
                        : "N/D"}
                </div>
            </div>

        </div>

        <h3>🌧️ Situazione recente</h3>

        <div class="info-grid">

            <div class="info-card">
                <div class="label">Pioggia ultimi 3 giorni</div>
                <div class="value">${pioggia3.toFixed(1)} mm</div>
            </div>

            <div class="info-card">
                <div class="label">Pioggia ultimi 7 giorni</div>
                <div class="value">${pioggia7.toFixed(1)} mm</div>
            </div>

            <div class="info-card">
                <div class="label">Pioggia ultimi 14 giorni</div>
                <div class="value">${pioggia14.toFixed(1)} mm</div>
            </div>

            <div class="info-card">
                <div class="label">Pioggia ultimi 20 giorni</div>
                <div class="value">${pioggia20.toFixed(1)} mm</div>
            </div>

            <div class="info-card">
                <div class="label">Pioggia ultimi 45 giorni</div>
                <div class="value">${pioggia45.toFixed(1)} mm</div>
            </div>

            <div class="info-card">
                <div class="label">Temperatura media 7 gg</div>
                <div class="value">
                    ${tempMedia7!==null
                        ? tempMedia7.toFixed(1)+" °C"
                        : "N/D"}
                </div>
            </div>

            <div class="info-card">
                <div class="label">Umidità media 7 gg</div>
                <div class="value">
                    ${umiditaMedia7!==null
                        ? umiditaMedia7.toFixed(0)+" %"
                        : "N/D"}
                </div>
            </div>

        </div>

        <div class="index-box">
            🍄 <b>Indice Buttata</b>
            <div class="index-number ${classeIndice(indicePorcino)}">
                ${indicePorcino}/100
            </div>
        </div>

        <div class="index-box">
            🥚 <b>Indice Ovulo</b>
            <div class="index-number ${classeIndice(indiceOvulo)}">
                ${indiceOvulo}/100
            </div>
        </div>
        `;


        /* =========================
           EVENTO RILEVANTE
           ========================= */

        if(eventoRilevante){

            const faseE=faseFinestra(giorniEvento,"estate");
            const faseA=faseFinestra(giorniEvento,"autunno");

            html+=`
            <hr>
            <h3>🌧️ Evento di pioggia rilevante</h3>

            <div class="event-card active">

                <div class="event-title">
                    🌧️ ${formatDataCompleta(eventoRilevante.data)}
                </div>

                <div class="info-grid">

                    <div class="info-card">
                        <div class="label">Pioggia evento</div>
                        <div class="value">
                            ${eventoRilevante.pioggia.toFixed(1)} mm
                        </div>
                    </div>

                    <div class="info-card">
                        <div class="label">Giorni trascorsi</div>
                        <div class="value">
                            ${giorniEvento}
                        </div>
                    </div>

                    <div class="info-card">
                        <div class="label">Shock termico stimato</div>
                        <div class="value">
                            ${eventoRilevante.shock.toFixed(1)} °C
                        </div>
                    </div>

                    <div class="info-card">
                        <div class="label">Punteggio acqua</div>
                        <div class="value">
                            ${scoreAcquaEvento}/25
                        </div>
                    </div>

                    <div class="info-card">
                        <div class="label">Punteggio shock</div>
                        <div class="value">
                            ${scoreShockEvento}/15
                        </div>
                    </div>

                </div>

                <span class="badge">${faseE.testo} ESTATE</span>
                <span class="badge">${faseA.testo} AUTUNNO</span>

            </div>

            <div class="finestra">

                <h3>☀️ Porcino estivo</h3>

                <b>
                    ${formatData(finestraEstate.inizio)}
                    →
                    ${formatData(finestraEstate.fine)}
                </b>

                <br>

                ${giorniEvento < MODELLO.estateMin
                    ? `⏳ Mancano circa ${MODELLO.estateMin-giorniEvento} giorni all'inizio della finestra.`
                    : giorniEvento <= MODELLO.estateMax
                        ? `🟢 Sei dentro la finestra indicativa dei ${MODELLO.estateMin}-${MODELLO.estateMax} giorni.`
                        : `🔴 La finestra indicativa estiva è già trascorsa.`
                }

                <br><br>

                <b>Punteggio timing:</b>
                ${timingEstate}/25

            </div>

            <div class="finestra autunno">

                <h3>🍂 Porcino autunnale</h3>

                <b>
                    ${formatData(finestraAutunno.inizio)}
                    →
                    ${formatData(finestraAutunno.fine)}
                </b>

                <br>

                ${giorniEvento < MODELLO.autunnoMin
                    ? `⏳ Mancano circa ${MODELLO.autunnoMin-giorniEvento} giorni all'inizio della finestra.`
                    : giorniEvento <= MODELLO.autunnoMax
                        ? `🟢 Sei dentro la finestra indicativa dei ${MODELLO.autunnoMin}-${MODELLO.autunnoMax} giorni.`
                        : `🔴 La finestra indicativa autunnale è già trascorsa.`
                }

                <br><br>

                <b>Punteggio timing:</b>
                ${timingAutunno}/25

            </div>
            `;

        }else{

            html+=`
            <hr>

            <div class="status medium">
                <h3>🌧️ Nessun evento di pioggia abbastanza significativo</h3>
                <p>
                    Il modello non ha trovato nello storico recente un episodio
                    di almeno ${MODELLO.pioggiaEventoMin} mm circa entro una finestra
                    di 3 giorni.
                </p>
                <p>
                    Il conto alla rovescia della buttata non viene quindi
                    considerato attivo.
                </p>
            </div>
            `;
        }


        /* =========================
           SPIEGAZIONE DEL PUNTEGGIO
           ========================= */

        html+=`
        <hr>

        <h3>🧠 Come viene costruito l'indice</h3>

        <div class="explain">

            <b>💧 Acqua:</b>
            ${scoreAcquaEvento}/25
            — l'evento di pioggia deve essere abbastanza consistente.

            <br>

            <b>❄️ Shock termico:</b>
            ${scoreShockEvento}/15
            — maggiore è il calo termico stimato dopo l'evento,
            maggiore è il contributo.

            <br>

            <b>⏱️ Timing:</b>
            ${Math.max(timingEstate,timingAutunno)}/25
            — il modello dà il massimo peso quando ci si trova
            nella finestra temporale indicativa.

            <br>

            <b>🌡️ Temperatura:</b>
            ${scoreTemp}/15
            — valuta la temperatura media recente.

            <br>

            <b>💦 Umidità:</b>
            ${scoreUmid}/10
            — contribuisce a mantenere condizioni favorevoli.

            <br>

            <b>⛰️ Altitudine:</b>
            ${scoreAlt}/5
            — contributo leggero, per non far decidere l'altitudine da sola.

        </div>


        <hr>

        <h3>🔮 Previsione prossimi 14 giorni</h3>

        <div class="info-grid">

            <div class="info-card">
                <div class="label">Pioggia prevista 14 gg</div>
                <div class="value">
                    ${pioggiaForecast
                        .reduce((a,b)=>a+(valore(b)||0),0)
                        .toFixed(1)} mm
                </div>
            </div>

            <div class="info-card">
                <div class="label">Giorno migliore</div>
                <div class="value">
                    ${formatDataCompleta(migliorGiorno)}
                </div>
            </div>

            <div class="info-card">
                <div class="label">Indice giorno migliore</div>
                <div class="value ${classeIndice(migliorIndice)}">
                    ${migliorIndice}/100
                </div>
            </div>

        </div>
        `;


        if(giorniFavorevoli.length){

            html+=`
            <div class="finestra">

                🟢 <b>Finestra favorevole prevista:</b>

                ${formatData(giorniFavorevoli[0])}
                →
                ${formatData(giorniFavorevoli[giorniFavorevoli.length-1])}

                <br><br>

                ⭐ Giorno più interessante:
                <b>${formatDataCompleta(migliorGiorno)}</b>
                con indice <b>${migliorIndice}/100</b>

            </div>
            `;

        }else{

            html+=`
            <div class="finestra">

                🔴 <b>Nei prossimi 14 giorni non emerge una
                finestra meteorologica fortemente favorevole.</b>

                <br><br>

                Il risultato può cambiare rapidamente dopo una nuova
                precipitazione significativa.

            </div>
            `;
        }


        /* =========================
           FORECAST GIORNO PER GIORNO
           ========================= */

        html+=`
        <hr>
        <h3>📅 Analisi giorno per giorno</h3>

        <div class="forecast-grid">
        `;

        for(let i=0;i<giorniForecast.length;i++){

            const best=i===migliorPosizione ? "best" : "";

            const p=valore(pioggiaForecast[i]) || 0;
            const um=valore(umiditaForecast[i]) || 0;
            const tmin=valore(tempMin[i]);
            const tmax=valore(tempMax[i]);
            const prob=valore(probPioggia[i]) || 0;

            html+=`
            <div class="day-card ${best}">

                <div class="date">
                    ${nomeGiorno(giorniForecast[i])}
                    <br>
                    ${formatData(giorniForecast[i])}
                </div>

                <hr>

                <div class="rain">
                    🌧️ ${p.toFixed(1)} mm
                </div>

                <div class="humidity">
                    💧 ${um.toFixed(0)} %
                </div>

                <div class="temp">
                    🌡️
                    ${tmin!==null?tmin.toFixed(1):"N/D"}
                    /
                    ${tmax!==null?tmax.toFixed(1):"N/D"}
                    °C
                </div>

                <div>
                    ☔ ${prob}%
                </div>

                <hr>

                <div class="score">
                    ${punteggiGiornalieri[i]}/100
                </div>

                ${i===migliorPosizione
                    ? `<div>⭐ MIGLIORE</div>`
                    : ""}

            </div>
            `;
        }

        html+=`
        </div>

        <p class="legend">
            🟢 ≥75 molto interessante •
            🟡 50–74 intermedio •
            🔴 &lt;50 debole
        </p>

        <div class="warning">
            ⚠️ <b>Nota importante:</b> questo è un modello empirico
            basato sui parametri meteorologici disponibili e sulle
            regole temporali indicate nella richiesta.
            Non può garantire la nascita dei funghi.
            La fruttificazione reale dipende anche da condizioni del
            suolo, specie, bosco, esposizione, vento, radiazione solare
            e condizioni precedenti non completamente rappresentate
            dai dati meteo.
        </div>
        `;


        document.getElementById("risultato").innerHTML=html;


        /* =========================================================
           GRAFICO
           ========================================================= */

        const labels=[
            ...giorniStorico,
            ...giorniForecast
        ];

        const pioggiaGrafico=[
            ...pioggiaStorico,
            ...pioggiaForecast
        ];

        const temperaturaGrafico=[
            ...temperaturaStorico,
            ...tempMax.map((v,i)=>{
                const max=valore(v);
                const min=valore(tempMin[i]);
                return max!==null && min!==null ? (max+min)/2 : null;
            })
        ];

        const ctx=document.getElementById("grafico");

        if(grafico){
            grafico.destroy();
        }

        grafico=new Chart(ctx,{
            data:{
                labels:labels,
                datasets:[
                    {
                        type:"bar",
                        label:"Pioggia mm",
                        data:pioggiaGrafico,
                        backgroundColor:labels.map((_,i)=>
                            i<giorniStorico.length
                            ? "rgba(33,150,243,0.45)"
                            : "rgba(76,175,80,0.45)"
                        ),
                        borderColor:"#1565c0",
                        borderWidth:1,
                        yAxisID:"y"
                    },
                    {
                        type:"line",
                        label:"Temperatura °C",
                        data:temperaturaGrafico,
                        borderColor:"#d32f2f",
                        backgroundColor:"rgba(211,47,47,0.1)",
                        tension:.35,
                        fill:false,
                        yAxisID:"y1"
                    }
                ]
            },

            options:{
                responsive:true,
                interaction:{
                    mode:"index",
                    intersect:false
                },

                plugins:{
                    legend:{
                        display:true
                    }
                },

                scales:{
                    y:{
                        beginAtZero:true,
                        position:"left",
                        title:{
                            display:true,
                            text:"Pioggia mm"
                        }
                    },

                    y1:{
                        position:"right",
                        title:{
                            display:true,
                            text:"Temperatura °C"
                        },
                        grid:{
                            drawOnChartArea:false
                        }
                    }
                }
            }
        });

    }catch(error){

        console.error(error);

        document.getElementById("risultato").innerHTML=`
            <div class="status bad">
                <h3>❌ Errore</h3>
                <p>
                    Non è stato possibile recuperare i dati meteorologici.
                </p>
                <p>
                    ${error.message}
                </p>
                <p>
                    Prova a ricaricare la pagina e ripetere l'analisi.
                </p>
            </div>
        `;

    }finally{
        btn.disabled=false;
    }
}
</script>

</body>
</html>
