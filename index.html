<!DOCTYPE html>
<html lang="it">
<script src="https://cdn.jsdelivr..jsscript>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Meteo Funghi</title>

<style>

body{
    font-family:Arial;
    max-width:1000px;
    margin:auto;
    padding:20px;
    background:#f2f8f2;
}

h1{
    color:#1b5e20;
}

select,button{
    width:100%;
    padding:12px;
    margin-top:10px;
}

.card{
    background:white;
    padding:20px;
    margin-top:20px;
    border-radius:10px;
}

</style>
</head>

<body>

<h1>🍄 Meteo Funghi Pratomagno</h1>

<select id="localita">

<option value="43.648210837035236,11.672634310976488">Pozza Nera</option>

<option value="43.61493048759856,11.69405168018871">Monte Lori Pic Nic</option>

<option value="43.60871375792392,11.705157764789897">Monte Lori Campeggio</option>

<option value="43.620597527331924,11.657856370237369">Tre Fonti</option>

<option value="43.619602322842674,11.65123576223233">Trappola</option>

<option value="43.61273877340515,11.656966725681125">Trevane</option>

<option value="43.50398069862869,11.545716077300723">Cocioni</option>

<option value="43.48898753383693,11.512202978459452">Moncioni</option>

<option value="43.52542199979008,11.522390226279295">Cavriglia Quercie</option>

<option value="43.52070302717631,11.502276149076717">Cavriglia Alta</option>

<option value="43.46761467459521,11.670888620816104">Pergine</option>

<option value="43.53632378809326,11.625183736328342">Tasso Lore</option>

</select>

<button onclick="analizza()">

Analizza Località

</button>

<div class="card" id="risultato">

<h3>Grafico Meteo Micologico</h3>
<canvas id="grafico"></canvas>

</div>

<script>


async function analizza(){

const coord =
document.getElementById("localita").value;

const split = coord.split(",");

const lat = split[0];
const lon = split[1];

document.getElementById("risultato").innerHTML =
"Caricamento dati meteo...";

const oggi = new Date();

const fine =
oggi.toISOString().split("T")[0];

const inizio = new Date();

inizio.setDate(inizio.getDate()-20);

const start =
inizio.toISOString().split("T")[0];

const url =
`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${start}&end_date=${fine}&daily=temperature_2m_mean,precipitation_sum&timezone=auto`;

try{

const risposta = await fetch(url);

const dati = await risposta.json();

const precipitazioni =
dati.daily.precipitation_sum;

const temperature =
dati.daily.temperature_2m_mean;

let pioggiaTotale = 0;

for(let p of precipitazioni){
pioggiaTotale += p;
}

let tempMedia = 0;

for(let t of temperature){
tempMedia += t;
}

tempMedia =
(tempMedia / temperature.length).toFixed(1);

let indicePorcino =
Math.round(
(pioggiaTotale * 0.5) +
((20-tempMedia) * 5)
);

if(indicePorcino>100)
indicePorcino=100;

if(indicePorcino<0)
indicePorcino=0;

let indiceOvulo =
Math.round(
(tempMedia*3) +
(pioggiaTotale*0.2)
);

if(indiceOvulo>100)
indiceOvulo=100;

let semaforo="🔴";

if(indicePorcino>75)
semaforo="🟢🟢";
else if(indicePorcino>50)
semaforo="🟢";
else if(indicePorcino>30)
semaforo="🟡";

document.getElementById("risultato").innerHTML =

`
<h2>Dati Micologici</h2>

<p>${semaforo}</p>

<p>🌧️ Pioggia ultimi 20 giorni:
<b>${pioggiaTotale.toFixed(1)} mm</b></p>

<p>🌡️ Temperatura media:
<b>${tempMedia} °C</b></p>

<p>🍄 Indice Porcino:
<b>${indicePorcino}/100</b></p>

<p>🥚 Indice Ovulo:
<b>${indiceOvulo}/100</b></p>

`;

const ctx =
document.getElementById("grafico");

if(grafico){
grafico.destroy();
}

grafico = new Chart(ctx, {

type:"line",

data:{

labels:dati.daily.time,

datasets:[

{
label:"Pioggia (mm)",
data:precipitazioni,
borderColor:"blue",
backgroundColor:"blue"
},

{
label:"Temperatura (°C)",
data:temperature,
borderColor:"red",
backgroundColor:"red"
}

]

}

});

}
catch(e){

document.getElementById("risultato").innerHTML =
"Errore recupero dati meteo";

}

}

const coord =
document.getElementById("localita").value;

const split = coord.split(",");

const lat = split[0];
const lon = split[1];

document.getElementById("risultato").innerHTML =
"Caricamento dati meteo...";

const url =
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto`;

try{

const risposta =
await fetch(url);

const dati =
await risposta.json();

const pioggia =
dati.daily.precipitation_sum[0];

const max =
dati.daily.temperature_2m_max[0];

const min =
dati.daily.temperature_2m_min[0];

document.getElementById("risultato").innerHTML =

`
<h2>Dati Meteo</h2>

<p>🌧️ Pioggia oggi: ${pioggia} mm</p>

<p>🌡️ Temperatura Max: ${max} °C</p>

<p>🌡️ Temperatura Min: ${min} °C</p>

<p>🍄 Indice Porcino: in sviluppo</p>

<p>🥚 Indice Ovulo: in sviluppo</p>

`;

}
catch(e){

document.getElementById("risultato").innerHTML =
"Errore nel recupero dati";

}

}

</script>

</body>
</html>
